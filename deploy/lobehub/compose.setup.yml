name: xcode-lobe-setup

services:
  setup:
    image: node:24-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    working_dir: /workspace
    command: ['node', 'deploy/lobehub/setup-env.mjs', '/workspace/.env']
    network_mode: none
    restart: 'no'
    volumes:
      - ../..:/workspace
